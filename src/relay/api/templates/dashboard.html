<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --bad:#b3261e; --ok:#1b7f3b; --warn:#9a6700; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9993; --line:#2c2c2a; --bad:#ff8a80; --ok:#7ddc8f; --warn:#f2c14e; } }
    body { font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; } h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    code { font: 12px ui-monospace, monospace; }
    .bad { color: var(--bad); } .ok { color: var(--ok); } .warn { color: var(--warn); } .muted { color: var(--muted); }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Relay <span class="muted">· queue dashboard (read-only)</span></h1>
  <div id="panels" hx-get="/dashboard/partial" hx-trigger="every 2s" hx-swap="innerHTML">
    {% include "_panels.html" %}
  </div>
</body>
</html>
