global:
  scrape_interval: 5s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: relay-api
    metrics_path: /metrics
    static_configs: [{targets: ["api:18082"]}]
  # workers and schedulers run as several replicas behind one DNS name
  - job_name: relay-worker
    dns_sd_configs: [{names: [worker], type: A, port: 9100}]
  - job_name: relay-scheduler
    dns_sd_configs: [{names: [scheduler], type: A, port: 9100}]
